<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <link rel="icon" type="image/avif" href="assets/brand/icon.avif" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="gallery-page">
  <div class="gallery-shell">
    <header class="site-header gallery-header">
      <div class="brand">
        <img src="assets/brand/icon.avif" alt="Hao logo" />
        <div>
          <h1>My Arcs and One-Shots</h1>
        </div>
      </div>

      <nav>
        <a href="index.html">Home</a>
        <a href="terms.html">Terms</a>
      </nav>
    </header>

    <main class="gallery-main">
      <p class="gallery-intro">All of my published larger works. (WORK IN PROGRESS)</p>
      <section id="galleryGrid" class="gallery-grid" aria-live="polite"></section>
    </main>
  </div>

  <div id="reader" class="reader" aria-hidden="true" hidden>
    <div class="reader-shell">
      <div class="reader-toolbar">
        <a id="readerDownload" class="reader-download" href="#" target="_blank" rel="noopener" download>Download PDF</a>
        <button class="reader-close" type="button" aria-label="Close reader">
          <img src="assets/icons/close.svg" alt="" aria-hidden="true" />
        </button>
      </div>

      <div class="reader-strip-wrap">
        <div id="readerStrip" class="reader-strip" aria-live="polite"></div>
      </div>

      <button id="readerSettingsToggle" class="reader-settings-toggle" type="button" aria-label="Open reader settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.18l-2.39.96a7.13 7.13 0 0 0-1.63-.94L14.5 2.5a.5.5 0 0 0-.5-.5h-3.99a.5.5 0 0 0-.5.5l-.34 2.52c-.58.23-1.12.55-1.63.94l-2.39-.96a.5.5 0 0 0-.61.18L2.71 9.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.18l2.39-.96c.51.39 1.05.71 1.63.94l.34 2.52a.5.5 0 0 0 .5.5h3.99a.5.5 0 0 0 .5-.5l.34-2.52c.58-.23 1.12-.55 1.63-.94l2.39.96a.5.5 0 0 0 .61-.18l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/>
        </svg>
      </button>

      <div id="readerSettingsPanel" class="reader-settings-panel" hidden>
        <div class="reader-mode-switch" aria-label="Reading mode">
          <button class="reader-mode-button is-active" type="button" data-mode="vertical">Vertical</button>
          <button class="reader-mode-button" type="button" data-mode="focus">Focus</button>
        </div>
        <label for="readerWidth">Page width</label>
        <input id="readerWidth" type="range" min="35" max="100" step="1" value="72" />
      </div>
    </div>
  </div>

  <script>
    const blueLinePages = Array.from({ length: 24 }, (_, index) => `assets/comics/lamapola-blue-line/chapter-0/pages/page-${index + 1}.png`);

    const series = [
      {
        title: 'L’amapola Blue Line',
        subtitle: 'Chapter 0',
        cover: 'assets/comics/lamapola-blue-line/chapter-0/cover/lamapola-blue-line-poster.png',
        pdf: 'assets/comics/lamapola-blue-line/chapter-0/lamapola-blue-line-chapter-0.pdf',
        images: blueLinePages
      }
    ];

    const galleryGrid = document.getElementById('galleryGrid');
    const reader = document.getElementById('reader');
    const readerStrip = document.getElementById('readerStrip');
    const closeButton = document.querySelector('.reader-close');
    const readerDownload = document.getElementById('readerDownload');
    const readerSettingsToggle = document.getElementById('readerSettingsToggle');
    const readerSettingsPanel = document.getElementById('readerSettingsPanel');
    const readerWidthInput = document.getElementById('readerWidth');
    const modeButtons = Array.from(document.querySelectorAll('.reader-mode-button'));

    let currentSeries = null;
    let currentPageIndex = 0;
    let readerMode = 'vertical';

    function applyReaderWidth() {
      const width = readerWidthInput.value;
      readerStrip.style.setProperty('--reader-page-width', `${width}%`);
    }

    function syncReaderModeButtons() {
      modeButtons.forEach((button) => {
        const active = button.dataset.mode === readerMode;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }

    function setReaderMode(mode) {
      if (!['vertical', 'focus'].includes(mode)) return;
      readerMode = mode;
      reader.dataset.mode = mode;
      syncReaderModeButtons();
      if (currentSeries) {
        if (mode === 'focus' && currentPageIndex >= currentSeries.images.length) {
          currentPageIndex = 0;
        }
        renderReader();
      }
    }

    function toggleReaderSettings(forceOpen) {
      const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : readerSettingsPanel.hidden;
      readerSettingsPanel.hidden = !shouldOpen;
      readerSettingsToggle.setAttribute('aria-expanded', String(shouldOpen));
    }

    function renderGallery() {
      galleryGrid.innerHTML = series.map((item, index) => `
        <article class="gallery-card">
          <button class="gallery-cover-button" type="button" data-index="${index}" aria-label="Open ${item.title}">
            <img class="gallery-cover" src="${item.cover}" alt="${item.title} cover" />
          </button>
          <div class="gallery-card-copy">
            <h2>${item.title}</h2>
            <p>${item.subtitle}</p>
          </div>
        </article>
      `).join('');
    }

    function renderReader() {
      if (!currentSeries) return;

      if (readerMode === 'focus') {
        const image = currentSeries.images[currentPageIndex] || currentSeries.images[0];
        const pageNumber = currentSeries.images.indexOf(image) + 1;
        readerStrip.innerHTML = `
          <figure class="reader-page reader-page--focus">
            <img src="${image}" alt="${currentSeries.title} page ${pageNumber}" />
          </figure>
        `;
        return;
      }

      readerStrip.innerHTML = currentSeries.images.map((image, index) => `
        <figure class="reader-page">
          <img src="${image}" alt="${currentSeries.title} page ${index + 1}" />
        </figure>
      `).join('');
    }

    function openReader(index) {
      currentSeries = series[index];
      currentPageIndex = 0;
      setReaderMode(readerMode);
      readerDownload.href = currentSeries.pdf || '#';
      readerDownload.hidden = !currentSeries.pdf;
      reader.hidden = false;
      reader.setAttribute('aria-hidden', 'false');
      document.body.classList.add('reader-open');
    }

    function closeReader() {
      reader.hidden = true;
      reader.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('reader-open');
      currentSeries = null;
      currentPageIndex = 0;
      readerStrip.innerHTML = '';
      readerDownload.href = '#';
      readerDownload.hidden = true;
    }

    function goToPreviousPage() {
      if (!currentSeries || readerMode !== 'focus') return;
      currentPageIndex = (currentPageIndex - 1 + currentSeries.images.length) % currentSeries.images.length;
      renderReader();
    }

    function goToNextPage() {
      if (!currentSeries || readerMode !== 'focus') return;
      currentPageIndex = (currentPageIndex + 1) % currentSeries.images.length;
      renderReader();
    }

    galleryGrid.addEventListener('click', (event) => {
      const cardButton = event.target.closest('.gallery-cover-button');
      if (!cardButton) return;

      const index = Number(cardButton.dataset.index);
      if (!Number.isNaN(index)) {
        openReader(index);
      }
    });

    closeButton.addEventListener('click', closeReader);
    readerSettingsToggle.addEventListener('click', () => toggleReaderSettings());
    readerWidthInput.addEventListener('input', applyReaderWidth);
    modeButtons.forEach((button) => {
      button.addEventListener('click', () => setReaderMode(button.dataset.mode));
    });

    const readerPrevButton = document.createElement('button');
    const readerNextButton = document.createElement('button');
    readerPrevButton.type = 'button';
    readerNextButton.type = 'button';
    readerPrevButton.className = 'reader-focus-nav reader-focus-nav--prev';
    readerNextButton.className = 'reader-focus-nav reader-focus-nav--next';
    readerPrevButton.setAttribute('aria-label', 'Previous page');
    readerNextButton.setAttribute('aria-label', 'Next page');
    readerPrevButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6a1 1 0 0 1 0 1.4L9.8 12l5.6 5.9a1 1 0 1 1-1.4 1.4l-6.3-6.6a1 1 0 0 1 0-1.4l6.3-6.6a1 1 0 0 1 1.4 0Z"/></svg>';
    readerNextButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 19.4a1 1 0 0 1 0-1.4L14.2 12 8.6 6.1a1 1 0 1 1 1.4-1.4l6.3 6.6a1 1 0 0 1 0 1.4l-6.3 6.6a1 1 0 0 1-1.4 0Z"/></svg>';
    readerPrevButton.addEventListener('click', goToPreviousPage);
    readerNextButton.addEventListener('click', goToNextPage);
    reader.appendChild(readerPrevButton);
    reader.appendChild(readerNextButton);

    reader.addEventListener('click', (event) => {
      if (event.target === reader) {
        closeReader();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (reader.hidden) return;

      if (event.key === 'Escape') {
        closeReader();
      }

      if (readerMode === 'focus') {
        if (event.key === 'ArrowLeft') {
          goToPreviousPage();
        } else if (event.key === 'ArrowRight') {
          goToNextPage();
        }
      }
    });

    applyReaderWidth();
    setReaderMode('vertical');
    readerSettingsPanel.hidden = true;
    renderGallery();
  </script>
</body>
</html>
