<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hao's Home Page</title>
  <link rel="icon" type="image/avif" href="assets/brand/icon.avif" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home">
  <div class="split-grid">
    <section class="panel left-panel">
      <header class="site-header">
        <div class="brand">
          <img src="assets/brand/icon.avif" alt="Hao logo" />
          <div>
            <h1>Hao Huynh</h1>
            <p class="eyebrow">Illustration / Comics</p>
          </div>
        </div>
      </header>

      <div class="content-block">
        <div class="links-block">
          <h2>Comics</h2>
          <ul class="link-list">
            <li><a href="gallery.html?entry=blueline" data-image="assets/social/bliss_selvedge_v15.png">L’amapola Blue Line</a></li>
            <li><a href="gallery.html" data-image="assets/social/dorianvineahug_v11.png">All One-shots & Arcs</a></li>
          </ul>
        </div>

        <div class="links-block">
          <h2>Socials</h2>
          <ul class="link-list socials">
            <li><a href="https://bsky.app/profile/borealhao.bsky.social" target="_blank" rel="noopener" data-image="assets/social/dorianvineahug_v11.png">Bluesky</a></li>
            <li><a href="https://lamapola.the-comic.org/comics/" target="_blank" rel="noopener" data-image="assets/social/bliss_selvedge_v15.png">ComicFury</a></li>
            <li><a href="https://www.youtube.com/@borealhao?sub_confirmation=1" target="_blank" rel="noopener" data-image="assets/social/GlareExport.png">YouTube</a></li>
            <li><a href="https://e621.net/posts?tags=borealhao+order%3Afavcount" target="_blank" rel="noopener" data-image="assets/social/bigleafexport.png">e621 (18+)</a></li>
            <li><a href="https://bsky.app/profile/lewdhao.bsky.social" target="_blank" rel="noopener" data-image="assets/social/bigleafexport.png">Bluesky (18+)</a></li>
          </ul>
        </div>

        <div class="links-block">
          <h2>Commissions - Email for Waitlist</h2>
          <p class="business">Business: <a href="mailto:borealhao@gmail.com">borealhao@gmail.com</a></p>
          <ul class="link-list">
            <li><a href="terms.html">Terms of Service</a></li>
          </ul>
        </div>
      </div>

      <footer class="page-footer"></footer>
    </section>

    <aside class="panel right-panel">
      <div class="image-frame">
        <img id="previewImage" src="assets/social/dorianvineahug_v11.png" alt="Artwork preview" />
        <div class="image-overlay"></div>
      </div>
    </aside>
  </div>

  <script>
    const previewImage = document.getElementById('previewImage');

    document.querySelectorAll('a[data-image]').forEach(link => {
      const image = link.dataset.image;

      link.addEventListener('mouseenter', () => {
        previewImage.src = image;
      });
      link.addEventListener('focus', () => {
        previewImage.src = image;
      });
    });
  </script>
</body>
</html>
